services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - questify-api

  questify-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - MUSICKIT_DEVELOPER_TOKEN=${MUSICKIT_DEVELOPER_TOKEN}
    expose:
      - "3000"
